<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="font-sans text-[#22253B]">
  <header class="mx-auto flex h-[62px] max-w-[1170px] items-center justify-between px-5 lg:px-8">
    <div>
      <img class="w-[52px]" src="./image.png" alt="">
    </div>
    <nav class="flex items-center gap-4 lg:gap-7">
      <p class="hidden text-[11px] lg:block">Чему вы научитесь</p>
      <p class="hidden text-[11px] lg:block">Процесс обучения</p>
      <p class="hidden text-[11px] lg:block">Стоимость</p>
      <p class="hidden text-[11px] lg:block">Контакты</p>
      <a href="#" class="hidden text-[11px] lg:block">Регистрация</a>
      <button class="rounded-full bg-[#38BFF2] px-4 py-2 text-[10px] text-white"><i class="fa-solid fa-arrow-right-long"></i>Войти</button>
      <p class="block text-[#F15525] lg:hidden"><i class="fa-solid fa-bars"></i></p>
    </nav>
  </header>


  <section class="bg-[#EAF2F5]">
    <div class="relative mx-auto flex max-w-[1170px] flex-col items-center overflow-hidden px-7 py-8 text-center lg:min-h-[550px] lg:flex-row lg:justify-around lg:px-10 lg:text-left">
      <div class="z-10">
        <h1 class="mb-4 text-[23px] font-semibold leading-[1.35] lg:mb-7 lg:text-[40px] lg:leading-[1.2]">
          Школа <span class="text-[#F15525]">{</span>программирования<span class="text-[#F15525]">}</span><br> для тех, кому нужны<br> реальные навыки,<br> а не просто сертификат</h1>
        <p class="mb-4 border-t border-gray-300 pt-3 text-[8px] leading-relaxed lg:mb-6 lg:text-[12px]">Пройдите тестирование, чтобы получить доступ<br> к бесплатным вводным урокам</p>
        <button class="w-full rounded-full bg-[#F15525] px-7 py-4 text-[10px] text-white lg:w-auto lg:px-8 lg:py-5 lg:text-[13px]">Пройти тестирование<i class="fa-solid fa-arrow-up ml-3"></i></button>
      </div>

      <div class="z-10 mt-8 lg:mt-0">
        <img class="w-[210px] lg:w-[360px]" src="./image copy.png" alt="">
      </div>

      <div class="absolute -bottom-5 left-1/2 z-20 flex h-[38px] w-[38px] -translate-x-1/2 items-center justify-center rounded-full bg-white lg:h-[45px] lg:w-[45px]"><i class="fa-regular fa-circle-down text-gray-400"></i></div>
    </div>
  </section>
</body>
</html>
